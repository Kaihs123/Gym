<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a6440">
<meta name="description" content="TheFairway — GPS distances, scorecards, live matches and leaderboards for Les Ormes and Les Mielles, Jersey.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TheFairway">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TheFairway — Jersey Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Archivo:wdth,wght@125,600;125,700;125,800;125,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{
  --ink:#0f1f19;--ink2:#41524b;--ink3:#7b8a84;--line:rgba(15,31,25,.08);
  --glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.82);
  --green:#1d6b4a;--green2:#2f8a63;--mint:#d9efe4;--sky:#e3edf9;--lav:#ece6f7;--peach:#fbe9df;
  --gold:#b8933a;--red:#c8553d;--blue:#3d6fc8;
  --r:22px;--shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px -12px rgba(20,50,40,.18);
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--navpad,0px));--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);font-feature-settings:"tnum" 1,"cv11" 1;
  background:radial-gradient(1200px 700px at 10% -10%,#dff1e7 0%,transparent 60%),
             radial-gradient(900px 600px at 110% 10%,#e6ecfb 0%,transparent 55%),
             radial-gradient(900px 700px at 50% 120%,#efe8f8 0%,transparent 60%),#f4f7f5;
  background-attachment:fixed;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(14px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#dcefe5);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.brand b{font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dot.ok{background:#2fae6f;box-shadow:0 0 0 4px rgba(47,174,111,.18)}
.dot.warn{background:#e0a33a;box-shadow:0 0 0 4px rgba(224,163,58,.18)}
.dot.bad{background:var(--red)}
h1.serif{font-family:"Instrument Serif",serif;font-weight:400;font-size:38px;line-height:1.02;margin:6px 2px 4px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:14px;margin:0 2px 18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.card{padding:16px;margin-bottom:12px}
.course{display:block;width:100%;text-align:left;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;transition:transform .15s}
.course:active{transform:scale(.985)}
.course .nm{font-family:"Instrument Serif",serif;font-size:25px;line-height:1.1}
.course .meta{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.course .meta b{display:block;font-size:17px;color:var(--ink);font-weight:700}
.course .art{position:absolute;right:-10px;top:-10px;opacity:.9}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(29,107,74,.09);color:var(--green);font-size:11px;font-weight:700;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:700;font-size:15px}
.btn.pri{background:linear-gradient(180deg,#24805a,#19603f);color:#fff;box-shadow:0 8px 20px -8px rgba(25,96,63,.6),0 1px 0 rgba(255,255,255,.25) inset}
.btn.sec{background:var(--glass2);border:1px solid rgba(15,31,25,.06)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(15,31,25,.05);gap:4px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:11px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* play */
.holebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hnav{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.hinfo{flex:1;text-align:center}
.hinfo .n{font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hinfo .t{font-family:"Instrument Serif",serif;font-size:30px;line-height:1}
.hstats{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:3px}
.hstats b{color:var(--ink)}
.dist{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:end;text-align:center;padding:18px 10px 14px}
.dist .l{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.dist .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.dist .big .v{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:.95;color:var(--green)}
.dist .u{font-size:13px;color:var(--ink3);font-weight:600;margin-left:2px}
.est{font-size:10.5px;font-weight:700;color:#a7782a;background:rgba(224,163,58,.14);padding:2px 7px;border-radius:999px;margin-top:6px;display:inline-block}
.reco{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px}
.reco .ic{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-weight:800;color:var(--green);font-size:13px}
.reco b{font-size:15px}.reco small{display:block;color:var(--ink2);font-size:12.5px}
.maptag{position:absolute;left:12px;top:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.step{padding:12px;display:flex;align-items:center;justify-content:space-between}
.step .k{font-size:12px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.step .val{font-size:26px;font-weight:800;min-width:34px;text-align:center}
.step .pm{width:34px;height:34px;border-radius:11px;background:rgba(15,31,25,.06);font-size:20px;font-weight:600;display:grid;place-items:center}
.shots{margin:0;padding:0;list-style:none}
.shots li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.shots li:first-child{border-top:0}
.sn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.shots .c{font-weight:700;font-size:14px}.shots .m{font-size:12px;color:var(--ink2)}
.shots .d{margin-left:auto;font-weight:800;font-size:17px;text-align:right}
.shots .d small{display:block;font-size:11px;color:var(--ink3);font-weight:600}
button.x[data-s],button.x[data-a=delround]{width:28px;height:28px;border-radius:9px;color:var(--ink3);font-size:16px}
/* scorecard */
table.sc{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
.sc th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:6px 2px}
.sc td{padding:7px 2px;border-top:1px solid var(--line)}
.sc td:first-child,.sc th:first-child{text-align:left;padding-left:4px}
.sc tr.tot td{font-weight:800;background:rgba(15,31,25,.03)}
.sc tr.cur td{background:rgba(29,107,74,.07)}
.mk{display:inline-grid;place-items:center;width:26px;height:26px;font-weight:800}
.mk.ea{border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 0 0 4px #fff,0 0 0 6px var(--gold)}
.mk.bi{border-radius:50%;box-shadow:0 0 0 2px var(--red);color:var(--red)}
.mk.bo{border-radius:4px;box-shadow:0 0 0 1.5px var(--blue);color:var(--blue)}
.mk.db{border-radius:4px;box-shadow:0 0 0 1.5px var(--blue),0 0 0 3.5px #fff,0 0 0 5px var(--blue);color:var(--blue)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:14px 12px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.bar{height:8px;border-radius:99px;background:rgba(15,31,25,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3aa577,#1d6b4a)}
.clubrow{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.clubrow:first-of-type{border-top:0}
.clubrow b{font-size:14px}
.clubrow .n{text-align:right;font-weight:800}
.clubrow .n small{display:block;font-size:10.5px;color:var(--ink3);font-weight:600}
input.num{width:64px;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;text-align:right}
input[type=range]{width:100%;accent-color:var(--green)}
.empty{text-align:center;padding:28px 16px;color:var(--ink2);font-size:14px}
/* tabbar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(528px,calc(100% - 24px));
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px;z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;font-size:11px;font-weight:600;color:var(--ink3)}
.tabs button.on{color:var(--green);background:rgba(29,107,74,.08)}
.tabs svg{width:22px;height:22px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,31,25,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);z-index:41;
  border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-b));transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto;background:rgba(250,252,251,.94)}
.sheet{visibility:hidden}.sheet.on{transform:translate(-50%,0);visibility:visible}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(15,31,25,.15);margin:0 auto 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{padding:12px 6px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13.5px;text-align:center}
.opt small{display:block;font-weight:600;font-size:11px;color:var(--ink3);margin-top:2px}
.opt.on{background:var(--green);color:#fff;border-color:var(--green)}
.opt.on small{color:rgba(255,255,255,.75)}
.h3{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--ink2)}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-140%);z-index:60;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;transition:transform .3s;background:rgba(15,31,25,.92);color:#fff}
.toast.on{transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--ink2);line-height:1.5}
a{color:var(--green)}
.hide{display:none!important}
.map{position:relative;padding:0;overflow:hidden;margin-bottom:12px;height:clamp(440px,76vh,760px)}
.sat{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#2c3b33;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.layers,.layer{position:absolute;left:0;top:0;width:0;height:0}
.layers{z-index:0}
.layer{transform-origin:0 0;will-change:transform}
.layer img{position:absolute;width:256px;height:256px;max-width:none;opacity:0;transition:opacity .25s;user-select:none;-webkit-user-drag:none;pointer-events:none}
.layer img.in{opacity:1}
.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.ov .lab{fill:#fff;font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.65);stroke-width:3px;stroke-linejoin:round}
.glass-dark{background:rgba(15,31,25,.62);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18)}
.mtop,.mctl,.mbanner,.mbar,.mmsg,.attr{z-index:2}
.mtop{position:absolute;left:10px;top:10px;right:62px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mtop .pill svg{margin:-4px 0}
.mctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.mctl button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.mbanner{position:absolute;left:10px;right:62px;top:10px;padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.3}
.mbanner b{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.brow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bpill{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700;color:#fff}
.bpill.pri{background:#ff7a3d}
.mbar{position:absolute;left:10px;right:10px;bottom:24px;border-radius:18px;padding:9px 12px;display:flex;gap:10px;align-items:center}
.mbar .cell{flex:1;min-width:0}
.mbar small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:700}
.mbar b{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.mbar b i{font-style:normal;font-size:12px;opacity:.7;margin-left:2px;font-weight:600}
.mbar em{display:block;font-style:normal;font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt2{display:block;font-size:13px;font-weight:600;line-height:1.25}
.xb{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;flex:none}
.mmsg{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);padding:14px;border-radius:16px;text-align:center;font-size:13px;line-height:1.4}
.attr{position:absolute;left:8px;right:8px;bottom:6px;font-size:9.5px;color:rgba(255,255,255,.85);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px;text-align:center;font-size:13px}
.hrs>div{background:rgba(255,255,255,.6);border-radius:12px;padding:7px 2px}
.hrs small{display:block;font-size:10px;color:var(--ink3);font-weight:600}
.pl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.pl span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(15,31,25,.05);color:var(--ink2)}
.pl span.k{background:var(--green);color:#fff}
html,body{overflow-x:hidden;max-width:100%}
.app>*{max-width:100%}
.hstats{flex-wrap:wrap;row-gap:2px}
.step{flex-wrap:wrap;gap:6px 4px}.step .k{flex:1 0 100%}.step .val{flex:1}
.step.row{flex-wrap:nowrap}.step.row .k{flex:1}.step.row .val{flex:0 0 auto;min-width:46px}
.seg button{padding:9px 6px}
@media(max-width:430px){.hrs{grid-template-columns:repeat(3,1fr)}.dist .big .v{font-size:54px}.dist .v{font-size:26px}.app{padding-left:12px;padding-right:12px}.hinfo .t{font-size:27px}.hstats{gap:4px 10px}}
@media(max-width:350px){.dist .big .v{font-size:46px}.btn{padding:12px 10px;font-size:14px}.grid4{grid-template-columns:repeat(3,1fr)}}
.teechip{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink);padding:2px 8px;border-radius:999px;background:rgba(15,31,25,.06)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(15,31,25,.35)}
/* ===== full-screen hole view — Fairway "Clubhouse" glass theme ===== */
:root{--hud:rgba(247,250,248,.82);--hud2:rgba(252,253,252,.94);--hink:#0f2219;--hink2:#566a61;--hline:rgba(15,34,25,.10);
  --acc:#1d6b4a;--acc2:#2f8a63;--accg:linear-gradient(160deg,#2b8c60 0%,#185c3e 100%);--gold:#b98b2e;--gold2:#e9c76f;
  --hshadow:0 10px 28px -12px rgba(6,28,18,.55),0 1px 0 rgba(255,255,255,.75) inset;--hbord:rgba(255,255,255,.6)}
body.dark{--hud:rgba(12,27,21,.78);--hud2:rgba(16,36,28,.92);--hink:#eef5f1;--hink2:rgba(226,238,231,.66);--hline:rgba(255,255,255,.10);
  --acc:#43c48b;--acc2:#5fd5a1;--accg:linear-gradient(160deg,#2f9b6b 0%,#18603f 100%);--gold:#e2bf6b;--gold2:#f1d58f;
  --hshadow:0 10px 28px -12px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.07) inset;--hbord:rgba(255,255,255,.12)}
body.fs{overflow:hidden}
body.fs #tabs,body.login #tabs{display:none}
body.fs .app{padding:0;max-width:none;min-height:0}
.pfs{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#1d2a23;z-index:1;touch-action:none;-webkit-user-select:none;user-select:none}
.pfs *{touch-action:none}
.mapfs{position:absolute;inset:0}
.mapfs .sat{border-radius:0}
.wfx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bubs{position:absolute;inset:0;pointer-events:none;z-index:2}
.hud{position:absolute;inset:0;pointer-events:none;z-index:5;color:var(--hink)}
.hud>*{pointer-events:auto}
.dk{background:var(--hud);color:var(--hink);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--hbord);box-shadow:var(--hshadow)}
.hbtn{position:absolute;left:10px;top:calc(var(--safe-t) + 16px);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--hink)}
.hcard{position:absolute;left:64px;right:10px;max-width:440px;top:calc(var(--safe-t) + 10px);display:flex;align-items:stretch;border-radius:20px;overflow:hidden;padding:0}
.hcard small{display:block;font-size:clamp(9.5px,2.8vw,11.5px);color:var(--hink2);font-weight:600;white-space:nowrap;letter-spacing:.02em}
.hcard b{font-weight:700;letter-spacing:-.02em}
.hn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px 4px 13px;background:var(--accg);color:#fff;min-width:54px}
.hn b{font-family:"Instrument Serif",serif;font-weight:400!important;font-size:clamp(32px,10vw,42px);line-height:.95;letter-spacing:0!important}
.hn i{font-style:normal;font-size:9.5px;margin-top:1px;opacity:.85;letter-spacing:.08em}
.hm{padding:8px 12px 8px 12px;border-right:1px solid var(--hline)}
.hm b{font-size:clamp(21px,6.8vw,29px);line-height:1.12;white-space:nowrap;color:var(--hink)}
.hm b i{font-style:normal;font-size:.48em;margin-left:2px;font-weight:600;color:var(--hink2)}
.hr{flex:1;display:flex;justify-content:space-around;align-items:center;padding:6px 6px;gap:4px;min-width:0}
.hr>*{text-align:center;color:var(--hink);min-width:0}

/* ================= Fairway design system v6 (overrides) ================= */
:root{--ink:#0e1f17;--ink2:#4a5d54;--ink3:#86948e;--line:rgba(14,31,23,.08);--green:#1d6b4a;--gold:#b98b2e;--red:#c0553d;
  --card:#ffffff;--canvas:#f3f5f1;--r:20px;--shadow:0 1px 2px rgba(14,31,23,.04),0 8px 24px -14px rgba(14,31,23,.18)}
body{background:var(--canvas);background-attachment:scroll;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.app{max-width:600px;padding:calc(12px + var(--safe-t)) 16px calc(110px + var(--safe-b))}
.glass{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);box-shadow:var(--shadow)}
.card{padding:18px;margin-bottom:14px;border-radius:var(--r)}
.eyebrow{font-size:11px;letter-spacing:.11em;color:var(--ink3);font-weight:700}
.eyebrow.light{color:rgba(255,255,255,.72)}
h1.serif{font-size:40px;letter-spacing:-.015em;line-height:1}
.note{color:var(--ink2);font-size:13px;line-height:1.5}
.sub{color:var(--ink2)}
.ic{flex:none;vertical-align:middle}
/* top bar */
.top{margin:2px 0 14px}.logo{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.brand b{font-family:"Instrument Serif",serif;font-size:22px;font-weight:400;letter-spacing:0;line-height:1}.brand small{letter-spacing:.06em;font-size:10.5px}
.pill.glass{background:#fff;font-size:12px;padding:8px 12px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,#2b8c60,#185c3e);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;box-shadow:0 6px 14px -8px rgba(10,60,38,.8)}
/* hero */
.hero{margin:0 -16px 16px;padding:0 16px}
.hero-in{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 18px;color:#fff;background:
  radial-gradient(120% 90% at 100% 0%,rgba(233,199,111,.28),transparent 55%),
  radial-gradient(90% 80% at 0% 100%,rgba(63,196,139,.25),transparent 60%),linear-gradient(160deg,#1f6e4c 0%,#123f2c 100%);
  box-shadow:0 18px 40px -22px rgba(10,50,32,.9)}
.hero-in::after{content:"";position:absolute;right:-40px;top:-30px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 30px rgba(255,255,255,.03),0 0 0 60px rgba(255,255,255,.02)}
.hero h1.serif{color:#fff;font-size:42px;margin:6px 0 12px}
.hwx{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.hwx span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.hwx svg circle{fill:transparent}.hwx svg path{fill:#e9c76f}
.teesel{display:flex;gap:6px;margin-bottom:10px}.teesel button{flex:1;padding:9px 6px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.12)}
.teesel button small{display:block;font-size:10.5px;font-weight:600;opacity:.7;margin-top:1px}.teesel button.on{background:#fff;color:var(--ink)}
.cta{position:relative;z-index:1;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 14px 18px;border-radius:18px;background:linear-gradient(160deg,#ecd08a,#c79a36);color:#241a05;text-align:left;box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
.cta b{display:block;font-size:18px}.cta small{display:block;font-size:12px;font-weight:600;opacity:.75}
.cta:active,.qgrid button:active,.opt:active,.btn:active,.rrow:active{transform:scale(.98)}
/* quick actions */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qgrid button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:11.5px;font-weight:700;color:var(--ink2)}
.qgrid .ic{color:var(--green)}
.gamecard{width:100%;display:flex;align-items:center;gap:14px;text-align:left}.gamecard .big2{font-size:46px;margin:2px 0}
.gc-r{flex:1;padding-left:14px;border-left:1px solid var(--line)}.gc-r b{font-size:26px;font-weight:800}.gc-r b small{font-size:13px;color:var(--ink3);font-weight:700}
.gamecard>.ic{color:var(--ink3)}
.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px;text-align:center}
.holes div{padding:7px 0;border-radius:10px;background:var(--canvas)}.holes small{display:block;font-size:10px;font-weight:700;color:var(--ink3)}.holes b{font-size:13px}.holes i{display:block;font-style:normal;font-size:9.5px;color:var(--ink3)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e2483a;margin-right:6px;box-shadow:0 0 0 4px rgba(226,72,58,.18);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(226,72,58,0)}}
/* buttons & options */
.btn{border-radius:14px;padding:13px 18px;font-size:15px}.btn.sec{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(14,31,23,.04)}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:13px;box-shadow:0 1px 2px rgba(14,31,23,.04)}
.opt .ic{color:var(--green)}.opt.dz .ic,.opt.dz{color:var(--red)}
.chip{padding:5px 11px;font-size:11.5px;border-radius:999px;background:rgba(29,107,74,.09);color:var(--green);font-weight:700;letter-spacing:.02em}
.seg{background:rgba(14,31,23,.05);border-radius:14px}.seg button.on{box-shadow:0 2px 8px rgba(0,0,0,.08)}
input.txt,input.num{border-radius:12px;border:1px solid rgba(14,31,23,.12);background:#fff;font-size:15px}
input.txt:focus,input.num:focus{outline:2px solid rgba(29,107,74,.35);border-color:var(--green)}
/* lists */
.rrow{padding:12px 2px}.rrow b{font-size:15px}
.kpi{border-radius:18px;padding:14px}.kpi .v{font-size:28px}
table.sc{font-size:13px}.sc th{font-size:10px}
/* tab bar */
.tabs{bottom:calc(10px + var(--safe-b));width:min(440px,calc(100% - 24px));padding:6px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);box-shadow:0 14px 30px -14px rgba(14,31,23,.35)}
.tabs button{padding:9px 0 8px;border-radius:18px;font-size:11px;font-weight:700;color:var(--ink3)}
.tabs button.on{color:#fff;background:linear-gradient(160deg,#2b8c60,#185c3e);box-shadow:0 6px 14px -8px rgba(10,60,38,.8)}
/* sheets */
.sheet{background:#fbfcfa;border-radius:28px 28px 0 0;padding:10px 18px calc(26px + var(--safe-b));box-shadow:0 -10px 40px -10px rgba(0,0,0,.25)}
.sheet h1.serif{font-size:32px}.grab{width:44px;height:5px;margin-bottom:14px}
.scrim{background:rgba(8,22,15,.35)}
/* undo bar: properly hidden when not in use */
#ubar{bottom:calc(96px + var(--safe-b));transform:translate(-50%,16px);opacity:0;visibility:hidden;pointer-events:none;transition:transform .25s,opacity .25s,visibility 0s .25s;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
#ubar.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition:transform .25s,opacity .25s}
body.fs #ubar{bottom:calc(160px + var(--safe-b))}
.toast{border-radius:16px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
/* login */
body.login{background:radial-gradient(120% 70% at 100% 0%,rgba(233,199,111,.25),transparent 55%),linear-gradient(170deg,#1f6e4c 0%,#0f3323 70%)}
body.login h1.serif,body.login .sub{color:#fff}body.login .sub{opacity:.75}body.login .chip{background:rgba(255,255,255,.14);color:#fff}
body.login .card{border:0;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
@media(max-width:380px){.qgrid button{font-size:10.5px}.hero h1.serif{font-size:36px}h1.serif{font-size:34px}}

/* ================= Clubhouse look (v7) ================= */
:root{--g:#0a6440;--g2:#0e5639;--g3:#062e1f;--lime:#b9e66d;--canvas:#f3f4f3}
.x{font-family:Archivo,Inter,sans-serif;font-stretch:125%;text-transform:uppercase;letter-spacing:.07em}
body{background:var(--canvas)}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function overpass(q){
  let last;for(const u of OVERPASS){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    if(r.ok)return await r.json();last=r.status}catch(e){last=e}}throw last||'overpass'}
function norm(s){return (s||'').toLowerCase().replace(/golf|club|course|&|country|the|'s|\(.*?\)/g,'').replace(/[^a-z]/g,'')}

/* Fetch hole lines + green polygons for one course, cache 30 days */
async function loadGeo(c){
  if(NET.osm[c.id]&&NET.osm[c.id]!=='loading')return NET.osm[c.id];
  const ck='fw.geo.'+c.id,cached=lsGet(ck);
  if(cached&&Date.now()-cached.at<30*864e5){NET.osm[c.id]=cached;return cached}
  if(NET.osm[c.id]==='loading')return null;NET.osm[c.id]='loading';
  try{
    // 1. find the course boundary that best matches this course
    const q1=`[out:json][timeout:25];(way["leisure"="golf_course"](around:1500,${c.lat},${c.lng});relation["leisure"="golf_course"](around:1500,${c.lat},${c.lng}););out tags center;`;
    const a=await overpass(q1);const want=norm(c.name);
    let best=null,bs=-1e9;(a.elements||[]).forEach(e=>{const n=norm(e.tags&&e.tags.name);const ce=e.center||{lat:c.lat,lon:c.lng};
      let sc=-meters([c.lat,c.lng],[ce.lat,ce.lon])/100;if(n&&(n.includes(want)||want.includes(n)))sc+=50;if(sc>bs){bs=sc;best=e}});
    let area=best?(best.type==='way'?2400000000+best.id:3600000000+best.id):null;
    const sel=area?`(area:${area})`:`(around:900,${c.lat},${c.lng})`;
    const q2=`[out:json][timeout:25];(way["golf"="hole"]${sel};way["golf"="green"]${sel};way["golf"="tee"]${sel};way["golf"="bunker"]${sel};way["natural"="sand"]${sel};way["golf"="water_hazard"]${sel};way["natural"="water"]${sel};way["golf"="fairway"]${sel};);out geom;`;
    const d=await overpass(q2);
    const holes={},greens=[],bunkers=[],water=[];
    (d.elements||[]).forEach(e=>{const g=(e.geometry||[]).map(p=>[p.lat,p.lon]);if(!g.length)return;const t=e.tags||{};
      if(t.golf==='hole'){const n=parseInt(t.ref);if(!n)return;holes[n]={line:g,tee:g[0],end:g[g.length-1],par:parseInt(t.par)||null}}
      else if(t.golf==='green')greens.push(g);
      else if(t.golf==='bunker'||t.natural==='sand')bunkers.push(g);
      else if(t.golf==='water_hazard'||t.natural==='water')water.push(g)});

    Object.values(holes).forEach(h=>{let bg=null,bd=1e9;greens.forEach(p=>{const cc=centroid(p);const dd=inPoly(h.end,p)?0:meters(h.end,cc);if(dd<bd){bd=dd;bg=p}});
      if(bg&&bd<60){h.poly=bg;h.green=centroid(bg)}else h.green=h.end});

}
function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1]});return[x/p.length,y/p.length]}

  if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]))ins=!ins}return ins}

function playsLike(x,d){

/* smooth closed outline through screen points (Catmull-Rom) */

/* rectangles already used by bubbles, so bunker tags don't sit on top of them */

function windAdvice(x,d,p){
  const u=U(),w=windNow(x.c),lh=S.set.hand==='L',out=[];
  if(!w)out.push(['No live wind yet','Wind needs an internet connection. It updates every 10 minutes while you play.']);
  else if(w.v<4&&(w.g||0)<10)out.push(['Calm',`Only ${Math.round(w.v)} mph — play your normal yardage and your stock shot.`]);
  else{
    const clubs=n=>{const c=Math.round(Math.abs(n)/11);return c<=0?'a fraction':c===1?'one':c===2?'two':'three'};
    const full=d>=driverY()-15;
    if(full&&p.wind!=null&&p.wind>=3)out.push(['Into the wind — keep it low',`Expect it to fly about ${fmt(p.wind)}${u} shorter than normal. Tee it a little lower, ball a touch further back, and make a smooth swing — swinging harder adds spin and makes the ball balloon. Consider a 3-wood if the landing area is tight.`]);
    else if(full&&p.wind!=null&&p.wind<=-3)out.push(['Wind behind — let it fly',`You'll get about ${fmt(-p.wind)}${u} extra. Tee it a touch higher to launch it into the wind and let it carry, and check what's in reach at the end of the fairway.`]);
    else if(p.wind!=null&&p.wind>=3)out.push(['Into the wind — club up',`It plays about ${fmt(p.wind)}${u} longer. Take ${clubs(p.wind)} more club and swing at about 80%: a smoother swing launches lower with less spin, so the wind grabs it less. Ball slightly back in your stance and hold a shorter finish.`]);
    else if(!full&&p.wind!=null&&p.wind<=-3)out.push(['Wind behind — club down',`It plays about ${fmt(-p.wind)}${u} shorter and the ball will run more when it lands. Take ${clubs(p.wind)} less club, land it short of the flag and let it release — downwind shots stop less.`]);
    if(Math.abs(p.drift)>=2){const goes=p.drift>0?'left':'right',aim=p.drift>0?'right':'left',shape=p.drift>0?(lh?'draw':'fade'):(lh?'fade':'draw');
      out.push([`Crosswind — aim ${fmt(Math.abs(p.drift))}${u} ${aim}`,`The wind will push the ball about ${fmt(Math.abs(p.drift))}${u} ${goes}. Aim at the gold AIM ring on the map and let it drift back, or hold it on line with a ${shape}.`])}
    if((w.g||0)-w.v>=8)out.push(['Gusty',`Gusting to ${Math.round(w.g)} mph. Wait for a lull before you swing — and into the wind, club for the gust rather than the average.`]);
    if(w.v>=18)out.push(['Strong wind — keep it low','Hit a knock-down: one or two more club, grip down an inch, shorter backswing and finish. Avoid high, lofted shots that hang in the air.']);
    if(d<60)out.push(['Short game','This close the wind matters less — keep it low and running rather than lofting it into the breeze.']);
    if(p.wind!=null&&Math.abs(p.wind)<3&&Math.abs(p.drift)<2&&d>=60)out.push(['Wind hardly affects this shot',`It's ${Math.round(w.v)} mph from the ${compass(w.from)}, but along this line it changes the distance by under ${fmt(3)}${u}.`]);
  }
  if(p.elev!=null&&Math.abs(p.elev)>=3)out.push([p.elev>0?'Uphill':'Downhill',p.elev>0?`The target sits about ${fmt(p.elev)}${u} above you — it plays longer and the ball stops quicker.`:`The target sits about ${fmt(-p.elev)}${u} below you — it plays shorter, expect more release.`]);
  return out}
/* little picture: your ball at the bottom, target at the top, wind arrows, where it ends up with no adjustment, and where to aim */
function windDiagram(x,from,to,d,p){
  const w=windNow(x.c);const W=280,H=210,B=[140,186],T=[140,34],ks=152/Math.max(d,20),ky=ks*2.4;
  const land=[T[0]-p.drift*ky,T[1]+(p.wind||0)*ks],aim=Math.abs(p.drift)>=2?[T[0]+p.drift*ky,T[1]]:null;
  let s=`<svg class="wdiag" viewBox="0 0 ${W} ${H}"><rect x="1" y="1" width="${W-2}" height="${H-2}" rx="18" fill="#e4f1e9"/><path d="M104 ${H}C108 140 112 80 118 18h44c6 62 10 122 14 ${H-18}" fill="#cfe7d8"/><ellipse cx="${T[0]}" cy="${T[1]}" rx="30" ry="18" fill="#b9e0c9" stroke="#fff" stroke-width="2"/>`;
  if(w&&w.v>=1){const rel=rad(w.from+180-bearing(from,to)),dx=Math.sin(rel),dy=-Math.cos(rel);
    [[60,70],[220,70],[60,150],[220,150],[140,112]].forEach(([cx,cy])=>{const L=18+Math.min(16,w.v*.8),x1=cx-dx*L,y1=cy-dy*L,x2=cx+dx*L,y2=cy+dy*L,ah=7;
      s+=`<g stroke="#5b8bd9" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".75"><path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}"/><path d="M${(x2-dx*ah-dy*ah*.7).toFixed(1)} ${(y2-dy*ah+dx*ah*.7).toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}L${(x2-dx*ah+dy*ah*.7).toFixed(1)} ${(y2-dy*ah-dx*ah*.7).toFixed(1)}"/></g>`})}
  s+=`<path d="M${B[0]} ${B[1]}L${T[0]} ${T[1]}" stroke="#fff" stroke-width="2.4" stroke-dasharray="5 5"/>`;
  if(Math.abs(land[0]-T[0])>2||Math.abs(land[1]-T[1])>2){const c=[(B[0]+land[0])/2+(land[0]-T[0])*.1,(B[1]+land[1])/2];
    s+=`<path d="M${B[0]} ${B[1]}Q${(B[0]+(T[0]-B[0])*.5).toFixed(1)} ${c[1].toFixed(1)} ${land[0].toFixed(1)} ${land[1].toFixed(1)}" stroke="#c0612f" stroke-width="2" fill="none" stroke-dasharray="2 4" stroke-linecap="round"/><path d="M${(land[0]-5).toFixed(1)} ${(land[1]-5).toFixed(1)}l10 10m0-10l-10 10" stroke="#c0612f" stroke-width="2.4" stroke-linecap="round"/>`}
  if(aim)s+=`<path d="M${B[0]} ${B[1]}L${aim[0].toFixed(1)} ${aim[1].toFixed(1)}" stroke="#b98b2e" stroke-width="2" stroke-dasharray="3 4"/><circle cx="${aim[0].toFixed(1)}" cy="${aim[1].toFixed(1)}" r="9" fill="none" stroke="#b98b2e" stroke-width="2.6"/><text x="${aim[0].toFixed(1)}" y="${(aim[1]-14).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#8a6418">AIM</text>`;
  s+=`<path d="M${T[0]} ${T[1]}V${T[1]-24}" stroke="#123" stroke-width="1.8"/><path d="M${T[0]+1} ${T[1]-24}l12 4-12 4z" fill="#e0b94f"/><circle cx="${B[0]}" cy="${B[1]}" r="10" fill="#1d6b4a" stroke="#fff" stroke-width="2.5"/><circle cx="${B[0]}" cy="${B[1]}" r="4" fill="#fff"/>
   <text x="12" y="${H-12}" font-size="10" fill="#5d7268" font-weight="600">${aim||Math.abs(land[0]-T[0])>2?'Sideways drift exaggerated so you can see it':'Wind arrows show where it blows'}</text></svg>`;
  return s}

  const tg=target(x,hm,pp),to=tg||hm.green,d=yds(pp.p,to),p=legPlays(x,pp.p,to,d),plays=d+p.adj,rec=recommend(plays);

  rows.push(p.elev==null?['Elevation','loading…','','']:Math.abs(p.elev)<2?['Level','no real height change','±0','']:[p.elev>0?'Uphill':'Downhill',`target ${fmt(Math.abs(p.elev))}${u} ${p.elev>0?'above':'below'} you`,`${p.elev>=0?'+':'−'}${fmt(Math.abs(p.elev))}${u}`,p.elev>0?'plays longer':'plays shorter']);
  openSheet(`<div class="eyebrow">Hole ${x.i+1} · ${tg?'to your target':'to the middle of the green'}</div>
   <div class="row" style="align-items:flex-end;gap:14px;margin:4px 0 2px"><div><div class="note">Actual</div><div class="big2" style="font-size:40px">${fmt(d)}<span style="font-size:18px">${u}</span></div></div><div style="font-size:22px;color:var(--ink3);padding-bottom:8px">→</div><div><div class="note">Plays like</div><div class="big2" style="color:var(--green)">${fmt(plays)}<span style="font-size:22px">${u}</span></div></div></div>
   ${windDiagram(x,pp.p,to,d,p)}
   ${rows.map(([a,b,c,dd])=>`<div class="clubrow" style="grid-template-columns:1fr auto"><div><b>${a}</b><div class="note">${b}</div></div><div class="n">${c}<small>${dd}</small></div></div>`).join('')}
   ${rec?`<div class="reco glass" style="margin-top:12px"><div class="ic">${short(rec.club)}</div><div><b>${rec.club}</b><small>For ${fmt(plays)}${u} · your ${rec.learned?'tracked average':'stock'} ${fmt(rec.carry)}${u}</small></div></div>`:''}
   <div class="h3">How to play it</div><ul class="adv">${windAdvice(x,d,p).map(([t,b])=>`<li><b>${t}</b>${b}</li>`).join('')}</ul>
   <p class="note" style="margin-top:4px">Bunker tags on the map show the distance to reach / carry each bunker from where you are.</p>
   <button class="btn sec full" style="margin-top:6px" data-a="lie">${IC('slope',18)} Check my lie / slope with the phone</button>

/* ---------- moving wind lines over the satellite photo ---------- */
const WFX={ps:[],last:0,raf:0,skip:0};
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function wfxStart(){if(WFX.raf||S.set.windfx===false||RM)return;WFX.last=performance.now();WFX.raf=requestAnimationFrame(wfxStep)}
function wfxStop(){if(WFX.raf)cancelAnimationFrame(WFX.raf);WFX.raf=0;const c=MAP.dom&&MAP.dom.querySelector('.wfx');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function wfxSpawn(W,H,fresh){return{x:Math.random()*W,y:Math.random()*H,age:fresh?Math.random()*2.5:0,life:1.6+Math.random()*2.2,s:.7+Math.random()*.6}}
function wfxStep(now){WFX.raf=0;
  if(VIEW!=='play'||!MAP.dom||!MAP.dom.isConnected||S.set.windfx===false){wfxStop();return}
  if(document.hidden){WFX.raf=requestAnimationFrame(wfxStep);return}
  const x=ctx(),w=x&&windNow(x.c),cv=MAP.dom.querySelector('.wfx');if(!cv){return}
  if(++WFX.skip%2){WFX.raf=requestAnimationFrame(wfxStep);return} /* ~30 fps is plenty and saves battery */
  const dpr=Math.min(2,window.devicePixelRatio||1),W=MAP.W,H=MAP.H;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const dt=Math.min(.08,(now-WFX.last)/1000);WFX.last=now;
  if(w&&w.v>=1&&MAP.view&&!document.body.classList.contains('moving')){
    const a=rad(windRot(w.from,MAP.view.rot)),dx=Math.sin(a),dy=-Math.cos(a);
    const gust=w.g&&w.g>w.v?1+((w.g/w.v)-1)*.5*Math.max(0,Math.sin(now/1900)):1;
    const sp=(16+w.v*5)*gust,N=Math.round(clamp(26+w.v*3.2,26,100));
    while(WFX.ps.length<N)WFX.ps.push(wfxSpawn(W,H,true));WFX.ps.length=N;
    g.lineCap='round';g.lineWidth=1.5;
    for(const p of WFX.ps){p.x+=dx*sp*p.s*dt;p.y+=dy*sp*p.s*dt;p.age+=dt;
      if(p.age>p.life||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40)Object.assign(p,wfxSpawn(W,H,false));
      const al=Math.sin(Math.PI*clamp(p.age/p.life,0,1))*.5,L=9+w.v*1.4*p.s;
      g.strokeStyle=`rgba(255,255,255,${al.toFixed(3)})`;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-dx*L,p.y-dy*L);g.stroke()}}
  WFX.raf=requestAnimationFrame(wfxStep)}

const LIE_S={on:false,b:0,g:0,n:0};
function onTilt(e){if(e.beta==null)return;LIE_S.b=LIE_S.b*.8+e.beta*.2;LIE_S.g=LIE_S.g*.8+e.gamma*.2;LIE_S.n++;drawLie()}
async function startLie(){

    window.addEventListener('deviceorientation',onTilt);LIE_S.on=true;LIE_S.n=0;setTimeout(()=>{if(!LIE_S.n){const e=document.getElementById('lieOut');if(e)e.innerHTML='<p class="note" style="color:var(--red)">No tilt sensor reading. This needs your phone (not a computer) and the app opened directly in Safari/Chrome.</p>'}},2500)}
  catch(e){const o=document.getElementById('lieOut');if(o)o.innerHTML='<p class="note" style="color:var(--red)">Motion access was blocked. On iPhone allow Motion &amp; Orientation access when asked.</p>'}}

function lieRead(b,g){const lh=S.set.hand==='L';const up=b,side=lh?-g:g; // side<0 => ball above feet (RH)
  const res=[];
  if(up>2)res.push(['Uphill lie',`${up.toFixed(0)}°`,'Ball flies higher and shorter — take about one more club, shoulders with the slope, expect a pull.']);
  else if(up<-2)res.push(['Downhill lie',`${(-up).toFixed(0)}°`,'Lower flight with more run — take about one less club, ball back in stance, swing down the slope.']);
  if(side<-2)res.push(['Ball above feet',`${(-side).toFixed(0)}°`,`Ball tends to go ${lh?'right':'left'} — aim ${lh?'left':'right'} and grip down.`]);
  else if(side>2)res.push(['Ball below feet',`${side.toFixed(0)}°`,`Ball tends to go ${lh?'left':'right'} — aim ${lh?'right':'left'}, flex knees, stay down.`]);
  if(!res.length)res.push(['Flat lie','<2°','Stock swing — no slope adjustment needed.']);return res}

/* ---------- handicap (World Handicap System style) ---------- */
function roundEval(r){
  const c=course(r.cid);if(!c)return{ok:false,played:0,n:0,gross:0};const t=teeOf(c,r.tee),n=t.h.length,rt=teeRating(t);
  const sc=r.holes.map(H=>H.g||autoGross(H)),played=sc.filter(Boolean).length,gross=sc.reduce((a,b)=>a+(b||0),0);
  let parP=0;sc.forEach((g,i)=>{if(g)parP+=t.h[i][0]});
  const idx=r.idx??+S.set.hcp,ch=courseHcp(t,idx),rk=siRank(t);let sf=0;sc.forEach((g,i)=>{if(g)sf+=stableford(g,t.h[i][0],strokesRec(rk[i],ch,n))});
  const base={c,t,n,played,gross,toPar:gross-parP,rt,sf,ch,idx};
  if(!rt||played<n)return Object.assign(base,{ok:false,why:!rt?'no rating':'unfinished'});
  /* adjusted gross: each hole capped at net double bogey */
  let ags=0;sc.forEach((g,i)=>{ags+=Math.min(g,t.h[i][0]+2+strokesRec(rk[i],ch,n))});
  const diff=(113/rt.s)*(ags-rt.cr);
  /* 9-hole score → 18-hole differential by adding the expected differential for the 9 not played (≈ 0.52 × index + 1.2) */
  const d18=n===9?diff+(0.52*idx+1.2):diff;
  return Object.assign(base,{ok:true,ags,diff:Math.round(diff*10)/10,d18:Math.round(d18*10)/10})}
const WHS_T={3:[1,-2],4:[1,-1],5:[1,0],6:[2,-1],7:[2,0],8:[2,0],9:[3,0],10:[3,0],11:[3,0],12:[4,0],13:[4,0],14:[4,0],15:[5,0],16:[5,0],17:[6,0],18:[6,0],19:[7,0],20:[8,0]};
function hcpIndex(list){
  const all=(list||S.rounds).filter(r=>!r.practice).map(r=>({r,e:roundEval(r)})).filter(o=>o.e.ok).sort((a,b)=>new Date(a.r.date)-new Date(b.r.date));
  const holes=all.reduce((a,o)=>a+o.e.n,0),last=all.slice(-20),n=last.length;
  if(n<3)return{n,holes,last,used:new Set()};
  const[k,adj]=WHS_T[n],best=[...last].sort((a,b)=>a.e.d18-b.e.d18).slice(0,k);
  const idx=Math.min(54,Math.round((best.reduce((a,o)=>a+o.e.d18,0)/k+adj)*10)/10);
  return{idx,n,k,adj,holes,last,used:new Set(best.map(o=>String(o.r.id)))}}
/* differentials over time: counting scores in green, the index as a dashed line */
function diffChart(hi){
  const L=hi.last;if(L.length<2)return'';const W=320,H=120,pl=26,pr=10,pt=12,pb=20,vs=L.map(o=>o.e.d18).concat(hi.idx!=null?[hi.idx]:[]);

  const X=i=>pl+(L.length===1?0:i*(W-pl-pr)/(L.length-1)),Yv=v=>pt+(v-mn)/(mx-mn)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:10px" role="img" aria-label="Handicap differentials over time">`;
  [mn,Math.round((mn+mx)/2),mx].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="rgba(15,31,25,.07)"/><text x="${pl-6}" y="${Yv(v)+3.5}" text-anchor="end" font-size="9.5" fill="#7b8a84">${v}</text>`});
  s+=`<polyline points="${L.map((o,i)=>X(i).toFixed(1)+','+Yv(o.e.d18).toFixed(1)).join(' ')}" fill="none" stroke="rgba(15,31,25,.18)" stroke-width="1.5"/>`;
  if(hi.idx!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Yv(hi.idx)}" y2="${Yv(hi.idx)}" stroke="#b98b2e" stroke-width="1.6" stroke-dasharray="4 4"/><text x="${W-pr}" y="${Yv(hi.idx)-5}" text-anchor="end" font-size="10" font-weight="700" fill="#8a6418">index ${hi.idx.toFixed(1)}</text>`;
  L.forEach((o,i)=>{const u=hi.used.has(String(o.r.id));s+=`<circle cx="${X(i).toFixed(1)}" cy="${Yv(o.e.d18).toFixed(1)}" r="${u?5:3.6}" fill="${u?'#1d6b4a':'#fff'}" stroke="${u?'#fff':'#9aa8a2'}" stroke-width="${u?2:1.5}"/>`});
  s+=`<text x="${pl}" y="${H-4}" font-size="9.5" fill="#7b8a84">${new Date(L[0].r.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text><text x="${W-pr}" y="${H-4}" text-anchor="end" font-size="9.5" fill="#7b8a84">${new Date(L[L.length-1].r.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text></svg>
   <div class="note" style="display:flex;gap:14px;margin-top:2px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#1d6b4a;margin-right:5px"></i>counts</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid #9aa8a2;margin-right:5px"></i>doesn't count</span><span>lower is better</span></div>`;
  return s}

/* ---------- keeping rounds safe: backup file + optional GitHub sync ---------- */
function exportData(){return{app:'fairway',v:2,saved:new Date().toISOString(),rounds:S.rounds,del:S.del,
  set:{hcp:S.set.hcp,cr:S.set.cr,hand:S.set.hand,units:S.set.units},setAt:S.setAt||0,bag:S.bag,greens:S.greens,tb:S.tb}}
function mergeData(d){
  if(!d||!Array.isArray(d.rounds))throw new Error('That file isn\'t a TheFairway backup');
  const del=new Set([...(S.del||[]),...(d.del||[])].map(String)),m=new Map();
  [...S.rounds,...d.rounds].forEach(r=>{const k=String(r.id),o=m.get(k);if(!o||(r.upd||0)>(o.upd||0))m.set(k,r)});
  S.del=[...del];S.rounds=[...m.values()].filter(r=>!del.has(String(r.id))).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(d.set&&(d.setAt||0)>(S.setAt||0)){if(d.set.hcp!=null)S.set.hcp=d.set.hcp;if(d.set.cr)S.set.cr=d.set.cr;if(d.set.hand)S.set.hand=d.set.hand;if(Array.isArray(d.bag))S.bag=d.bag;S.setAt=d.setAt}
  if(d.greens)S.greens=Object.assign({},d.greens,S.greens);if(d.tb)S.tb=Object.assign({},d.tb,S.tb)}
function downloadBackup(){
  if(inFrame()){showText(JSON.stringify(exportData()));return} /* the Claude preview can't save files — show the backup to copy instead */
  const blob=new Blob([JSON.stringify(exportData(),null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`fairway-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Backup saved to your downloads')}
function restoreFile(file){const fr=new FileReader();fr.onload=()=>{try{const n0=S.rounds.length;mergeData(JSON.parse(fr.result));save();closeSheet();render();toast(`Restored — ${S.rounds.length-n0} round${S.rounds.length-n0===1?'':'s'} added`)}catch(e){toast(e.message||'That backup could not be read')}};fr.readAsText(file)}
const GIST_FILE='fairway-rounds.json';
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+S.sync.token,'X-GitHub-Api-Version':'2022-11-28'},opt.body?{'Content-Type':'application/json'}:{})}));
  if(!r.ok)throw new Error(r.status===401?'GitHub didn\'t accept that token':r.status===403?'That token can\'t save gists — tick the gist permission':r.status===404?'GitHub backup not found':'GitHub error '+r.status);
  return r.json()}
let SYNCING=null,syncT=0;
function syncSoon(){if(SBU){clearTimeout(cloudT);cloudT=setTimeout(()=>cloudSync(true),1500)}if(!S.sync||!S.sync.token)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(true),1500)}
function syncNow(quiet){
  if(!S.sync||!S.sync.token)return Promise.resolve();if(SYNCING)return SYNCING;
  SYNCING=(async()=>{try{
    if(!S.sync.user){const u=await gh('/user');S.sync.user=u.login}
    if(!S.sync.gist){const list=await gh('/gists?per_page=100');const f=list.find(g=>g.files&&g.files[GIST_FILE]);if(f)S.sync.gist=f.id}
    if(S.sync.gist){const g=await gh('/gists/'+S.sync.gist),f=g.files&&g.files[GIST_FILE];
      if(f){let txt=f.content;if(f.truncated)txt=await (await fetch(f.raw_url)).text();try{mergeData(JSON.parse(txt))}catch(e){}}}
    const content=JSON.stringify(exportData());
    if(S.sync.gist)await gh('/gists/'+S.sync.gist,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content}}})});
    else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Fairway golf — rounds & handicap backup',public:false,files:{[GIST_FILE]:{content}}})});S.sync.gist=g.id}
    S.sync.at=Date.now();S.sync.err='';save();if(!quiet)toast('Rounds synced to GitHub');if(VIEW!=='play')render()
  }catch(e){S.sync.err=String(e.message||e);save();if(!quiet)toast(S.sync.err)}finally{SYNCING=null}})();
  return SYNCING}

    case'mapthis':if(x)modeStart(isAligned(x.c.id)?'map':'align');break;
    case'modecancel':modeCancel();break;
    case'modegps':if(MAP.mode&&GPS.pos)modeTap(GPS.pos.slice());else toast('No GPS fix yet — tap the map instead');break;
    case'remap':modeStart('map');break;
    case'realign':modeStart('align');break;
    case'resetmap':if(x){const k=gk(x.c,x.i);delete S.greens[k];delete S.tb[k];delete S.teesPos[k];save();closeSheet();MAP.touched=false;MAP.sig='';render();toast('Hole '+(x.i+1)+' back to the course data')}break;
    case'g+':case'g-':{const H=x.H;const cur=H.g||autoGross(H);H.g=cur?Math.max(1,cur+(a==='g+'?1:-1)):x.par;H.man=true;save();render();break}
    case'p+':x.H.p++;if(!x.H.man)x.H.g=0;save();render();break;
    case'p-':x.H.p=Math.max(0,x.H.p-1);save();render();break;
    case'pen+':x.H.pen++;save();render();break;
    case'pen-':x.H.pen=Math.max(0,x.H.pen-1);save();render();break;
    case'fir':x.H.fir=x.H.fir===b.dataset.v?null:b.dataset.v;save();render();break;
    case'delshot':x.H.shots.splice(+b.dataset.k,1);save();render();break;
    case'card':setView('card');break;
    case'end':if(Date.now()-(window._endA||0)<4000){closeSheet();archive();toast('Round saved');setView('stats')}else{window._endA=Date.now();toast('Tap Finish again to save the round')}break;
    case'delround':if(Date.now()-(window._delA||0)<4000){S.rounds=S.rounds.filter(r=>r.id!=b.dataset.id);S.del.push(String(b.dataset.id));save();closeSheet();render();syncSoon();toast('Round deleted')}else{window._delA=Date.now();toast('Tap again to delete this round')}break;
    case'match':matchSheet();break;
    case'mteampick':teamPick();break;
    case'mteam':MT.team=b.dataset.v;if(S.match)S.match.team=MT.team;save();pushMatch().then(()=>{closeSheet();toast('You\'re on Team '+MT.team);matchSheet()});break;
    case'playtab':if(R()){setView('play');onHole()}else teeSheet(HOME());break;
    case'mode':{const f=b.dataset.f;if(f==='match'){matchStartSheet();if(SBU)loadLive().then(()=>{if($('#sheet').classList.contains('on'))matchStartSheet()});break}
      const c=course(HOME());if(!R())newRound(c.id,HOME_TEE??defaultTee(c));R().fmt=f;save();startGPS();setView('play');onHole();toast(f==='stableford'?'Stableford round — points on your card':'Stroke play — good luck');break}
    case'stab':STAT_TAB=b.dataset.v;render();break;
    case'lbm':LB_MET=b.dataset.v;render();break;
    case'hcourse':if(S.active&&S.active.cid!==b.dataset.c){toast('Finish or discard your current round first');break}S.set.home=b.dataset.c;HOME_TEE=null;save();loadWx(course(HOME()));render();toast(HOMENM()+' selected');break;
    case'htee':HOME_TEE=+b.dataset.i;render();break;
    case'teeoff':{const c=course(HOME());if(S.active){setView('play');onHole();break}newRound(c.id,HOME_TEE??defaultTee(c));startGPS();setView('play');onHole();break}
    case'navpad':S.set.navpad=b.dataset.v==='1';save();applyTheme();toolsSheet();break;
    case'round':if(SW.swallow&&Date.now()-SW.swallow<350)break;if(SW.open){SW.open.style.transform='';SW.open=null;break}roundSheet(b.dataset.id);break;
    case'redit':editRoundSheet(b.dataset.id);break;
    case'rdel':askDelete([b.dataset.id]);break;
    case'rshare':shareRound(b.dataset.id);break;
    case'rprac':togglePractice(b.dataset.id);break;
    case'discard':discardRound();break;
    case'selon':SEL=new Set();render();break;
    case'selnone':SEL=null;render();break;
    case'selt':{const k=String(b.dataset.id);SEL.has(k)?SEL.delete(k):SEL.add(k);render();break}
    case'selall':S.rounds.forEach(r=>SEL.add(String(r.id)));render();break;
    case'seltoday':{const d=new Date().toDateString();S.rounds.forEach(r=>{if(new Date(r.date).toDateString()===d)SEL.add(String(r.id))});render();break}
    case'seldel':if(SEL&&SEL.size)askDelete([...SEL]);break;
    case'fullscr':closeSheet();if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Full screen not allowed here'));break;
    case'bkedit':modeStart('bunk');break;
    case'bkreset':if(x){if(S.bk){delete (S.bk.add||{})[x.c.id];delete (S.bk.hide||{})[x.c.id]}save();schedule();toast('Bunkers reset to Fairway\'s map')}break;
    case'mstart':matchStartSheet();if(SBU)loadLive().then(()=>{if($('#sheet').classList.contains('on'))matchStartSheet()});break;
    case'mjoinid':joinMatch(b.dataset.id);break;
    case'mshare':{const v=$('#mtUrl').value;navigator.share({title:'Join my TheFairway match',text:'Join my golf match on TheFairway — code '+MT.id,url:v}).catch(()=>{});break}
    case'mnew':startMatch(b.dataset.f);break;
    case'mjoin':{const v=($('#mjCode').value||'').trim();if(v.length<4){toast('Enter the match code');break}joinMatch(v);break}
    case'mleave':closeSheet();closeMatch(false);toast('Left the match');break;
    case'mcopy':{const v=$('#mtUrl').value;try{navigator.clipboard.writeText(v).then(()=>toast('Link copied'))}catch(e){}break}
    case'mwatch':openMatch(b.dataset.id,true).then(ok=>{if(ok)matchSheet()});break;
    case'sbin':{const em=($('#sbEmail').value||'').trim();if(!/^\S+@\S+\.\S+$/.test(em)){toast('Enter your email');break}signIn(em);break}
    case'sbpw':case'sbup':{const em=($('#sbEmail').value||'').trim(),pw=$('#sbPass').value||'';if(!/^\S+@\S+\.\S+$/.test(em)||pw.length<6){toast('Enter your email and a password of 6+ characters');break}
      if(!SB){toast('Online account needs the app opened from its web link');break}
      (a==='sbup'?SB.auth.signUp({email:em,password:pw}):SB.auth.signInWithPassword({email:em,password:pw})).then(({data,error})=>{
        if(!error&&a==='sbup'){const nm=($('#sbName')&&$('#sbName').value||'').trim();if(nm){S.set.name=nm.slice(0,30);S.setAt=Date.now();save()}}
        if(error)toast(error.message);else if(a==='sbup'&&!data.session)toast('Account made — but Supabase wants email confirmation. Turn off "Confirm email" in Supabase, then sign in.');else toast('Signed in')});break}
    case'sbout':signOut();break;
    case'guest':S.guest=true;save();VIEW=S.active?'play':'home';render();break;
    case'admref':ADM=null;render();break;
    case'admp':adminPlayer(b.dataset.id);break;
    case'admr':case'admdel':case'admm':adminAct(a,b);break;
    case'sbsync':cloudSync(false);break;
    case'sbboard':loadBoard();toast('Refreshing…');break;
    case'addround':addRoundSheet();break;
    case'ratings':ratingsSheet();break;
    case'backup':backupSheet();break;
    case'usebuiltin':if(x){const pr=presetFor(x.c.id);if(pr)delete S.align[x.c.id+':'+pr.id];save();closeSheet();MAP.touched=false;MAP.sig='';render();toast('Using the automatic course placement')}break;
    case'units':S.set.units=b.dataset.v;save();render();break;
    case'hand':S.set.hand=b.dataset.v;save();render();break;
    case'tab':setView(b.dataset.v);break;
    case'export':downloadBackup();break;
    case'import':openSheet(`<h1 class="serif" style="font-size:28px">Restore backup</h1><textarea id="imp" style="width:100%;height:160px;border-radius:12px;border:1px solid var(--line);padding:10px;font:12px monospace"></textarea><button class="btn pri full" id="impGo" style="margin-top:10px">Restore</button>`);
      $('#impGo').onclick=()=>{try{const d=JSON.parse($('#imp').value);if(!d.bag)throw 0;S=Object.assign(load(),d);save();closeSheet();render();toast('Restored')}catch(err){toast('That backup could not be read')}};break;
  }
});
function showText(t){openSheet(`<h1 class="serif" style="font-size:28px">Your backup</h1><p class="note">Select all and copy.</p><textarea style="width:100%;height:160px;border-radius:12px;border:1px solid var(--line);padding:10px;font:11px monospace">${t.replace(/</g,'&lt;')}</textarea>`)}
document.addEventListener('change',e=>{
  if(e.target.id==='pname'){S.set.name=e.target.value.trim().slice(0,30);S.setAt=Date.now();save()}
  if(e.target.id==='hcp'){S.set.hcp=Math.max(-10,Math.min(54,parseFloat(e.target.value)||0));S.setAt=Date.now();save();syncSoon()}
  if(e.target.dataset.bag){const b=S.bag.find(z=>z.c===e.target.dataset.bag);b.y=Math.max(0,parseInt(e.target.value)||0);S.setAt=Date.now();save();syncSoon()}
});

/* ---------- render ---------- */
const TABS=[['home','Clubhouse','M3 11l9-7 9 7v9h-6v-6H9v6H3z'],['play','Play','M14 3l-4 15c-.5 2-3.5 2-4 0M10 18H6'],['lb','Leaderboard','M8 4h8v5a4 4 0 01-8 0V4zM8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8 20h8'],['stats','Rounds','M5 4h14v16H5zM8 8h8M8 12h8M8 16h5'],['bag','Bag','M8 8V5a4 4 0 018 0v3M5 8h14l-1 12H6z']];
function render(){
  const v=VIEW,fs=v==='play'&&!!R();document.body.classList.toggle('login',v==='login');const map={login:loginView,lb:lbView,home,play:()=>R()?play():home(),card:cardView,stats:roundsView,bag:bagView};
  document.body.classList.toggle('fs',fs);applyTheme();
  $('#app').innerHTML=(map[v]||home)();
  if(fs){HUD_LAST='';hudRender();fillMap();wfxStart()}else wfxStop();swipeInit()
  $('#tabs').innerHTML=TABS.map(([k,l,p])=>`<button class="${v===k||(v==='card'&&k==='stats')?'on':''}" data-a="${k==='play'?'playtab':'tab'}" data-v="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>${l}</button>`).join('');
}
function renderLive(){
  if(VIEW!=='play'||!R()){const p=document.querySelector('.top .pill');if(p)p.outerHTML=header().match(/<button class="pill[\s\S]*?<\/button>/)[0];return}
  if(!document.getElementById('hud')){render();return}
  fillMap();hudRender();refreshElevSoon();
}
setInterval(()=>{if(VIEW==='play'&&R()){const c=ctx().c;const w=NET.wx[c.id];if(w&&w!=='loading'&&Date.now()-w.at>10*60e3)loadWx(c)}},60e3);
/* ---------- app shell: works offline, tells you when a new version is ready, and can be installed ---------- */
const STANDALONE=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let INSTALL=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL=e;if(VIEW==='bag')render()});
window.addEventListener('appinstalled',()=>{INSTALL=null;if(VIEW==='bag')render();toast('TheFairway is on your home screen')});
function installCard(){if(STANDALONE()||inFrame())return'';const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(INSTALL)return `<div class="card glass"><div class="row"><div style="min-width:0"><b>Install TheFairway</b><div class="note">Add it to your home screen — opens full screen like an app and works with no signal.</div></div><span class="sp"></span><button class="btn pri" id="instBtn" style="flex:none">Install</button></div></div>`;
  if(ios)return `<div class="card glass"><b>Add TheFairway to your home screen</b><div class="note">In Safari tap the Share button, then <b>Add to Home Screen</b>. It then opens full screen like an app and works with no signal.</div></div>`;
  return''}
document.addEventListener('click',e=>{if(e.target.id==='instBtn'&&INSTALL){const p=INSTALL;INSTALL=null;p.prompt();if(p.userChoice)p.userChoice.then(()=>{if(VIEW==='bag')render()},()=>{})}});
if('serviceWorker' in navigator&&!inFrame()&&location.protocol==='https:')window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
/* an installed app can stay open for days — check now and then whether a newer version has been uploaded */
let VER0=null,verT=0;
async function checkUpdate(){if(inFrame()||location.protocol!=='https:'||navigator.onLine===false||Date.now()-verT<15*60e3)return;verT=Date.now();
  try{const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});if(!r.ok)return;const v=r.headers.get('etag')||r.headers.get('last-modified');if(!v)return;
    if(VER0==null){VER0=v;return}
    if(v!==VER0){let el=$('#upd');if(!el){el=document.createElement('div');el.id='upd';el.innerHTML='<span>A new version is ready</span><button id="updBtn">Update</button>';document.body.appendChild(el);
      $('#updBtn').onclick=()=>{save();location.reload()}}el.classList.add('on')}}catch(e){}}
setTimeout(checkUpdate,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
sbInit();
applyTheme();
render();
loadWx(course(HOME()));
if(S.active){startGPS();onHole()}
if(S.sync&&S.sync.token&&Date.now()-(S.sync.at||0)>20*60e3)setTimeout(()=>syncNow(true),2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&VIEW==='play'&&R())wfxStart()});
document.addEventListener('fullscreenchange',()=>{applyTheme();if(MAP.dom){MAP.H=MAP.dom.clientHeight;schedule()}});
</script>
</body>
